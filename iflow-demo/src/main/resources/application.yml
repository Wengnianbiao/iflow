spring:
  profiles:
    active: ${profiles.active:local}
  application:
    name: iflow
  main:
    banner-mode: off
    allow-bean-definition-overriding: true

  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      enabled: true
      max-file-size: ${iflow.open-api.max-body-bytes:10485760}B
      max-request-size: ${iflow.open-api.max-body-bytes:10485760}B

#日志配置 默认配置 后期切换
logging:
  config: classpath:logback-spring.xml

server:
  servlet:
    encoding:
      charset: "UTF-8"
      force: true
      enabled: true
